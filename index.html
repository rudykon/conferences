function loadPapers(meta){const key=meta.conference+'-'+meta.year;window.paperCollections=window.paperCollections||{};if(window.paperCollections[key])return Promise.resolve(window.paperCollections[key]);if(pendingLoads.has(key))return pendingLoads.get(key);const pending=new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='assets/'+key+'.js';script.onload=()=>window.paperCollections[key]?resolve(window.paperCollections[key]):reject(new Error('Missing dataset'));script.onerror=()=>reject(new Error('Unable to load dataset'));document.head.append(script)});pendingLoads.set(key,pending);pending.catch(()=>pendingLoads.delete(key));return pending}
async function setCollection(){const meta=data.collections.find(c=>c.conference===$('conference').value&&String(c.year)===$('year').value);if(!meta)return;const sequence=++loadSequence;collection=null;topic='all';page=1;$('query').value='';$('abstractFilter').value='all';$('kind').value='all';$('topics').replaceChildren();$('papers').replaceChildren();$('total').textContent='—';$('abstracts').textContent='—';$('topicTotal').textContent='—';$('topicCount').textContent='';$('count').textContent='';$('page').textContent='';$('heading').textContent=tr().heading(meta);$('resultsTitle').textContent=lang()==='en'?'Loading…':'正在加载…';try{const loaded=await loadPapers(meta);if(sequence!==loadSequence)return;collection={...meta,papers:loaded.papers};let counts=new Map;for(const p of collection.papers)for(const t of new Set(p.topics))counts.set(t,(counts.get(t)||0)+1);collection.counts=counts;collection.search=collection.papers.map(p=>norm([p.title,p.title_zh,p.authors,p.abstract,p.abstract_zh,p.kind,p.track,p.search_extra,...p.topics,...p.topics.map(t=>topicEn[t]||'')].join(' ')));localize();search()}catch(error){if(sequence!==loadSequence)return;$('resultsTitle').textContent=lang()==='en'?'Data could not be loaded':'数据加载失败';$('papers').append(el('div','empty',lang()==='en'?'Keep the assets folder next to this page.':'请确保 assets 文件夹与网页放在一起。'))}}
function localize(){const t=tr();document.documentElement.lang=lang()==='en'?'en':'zh-CN';document.title=t.brand;for(const [id,key] of Object.entries({brand:'brand',conferenceLabel:'conference',yearLabel:'year',languageLabel:'language',topicsLabel:'topics',totalLabel:'papers',abstractsLabel:'abstractCount',topicTotalLabel:'topicTotal',abstractLabel:'abstract',kindLabel:'kind',reset:'reset',prev:'prev',next:'next',close:'close'}))$(id).textContent=t[key];$('toggle').textContent='☰ '+t.topics;$('switches').setAttribute('aria-label',[t.conference,t.year,t.language].join(', '));$('conference').setAttribute('aria-label',t.conference);$('year').setAttribute('aria-label',t.year);$('language').setAttribute('aria-label',t.language);$('topics').setAttribute('aria-label',t.topics);$('searchPanel').setAttribute('aria-label',t.search);$('query').setAttribute('aria-label',t.search);$('query').placeholder=t.placeholder;$('language').options[0].textContent=t.chinese;$('language').options[1].textContent=t.english;$('heading').textContent=t.heading(collection);$('total').textContent=fmt(collection.papers.length);$('abstracts').textContent=fmt(collection.papers.filter(p=>abstract(p)).length);$('topicTotal').textContent=fmt(collection.counts.size);$('topicCount').textContent='· '+fmt(collection.counts.size)+' '+t.topicCount;const af=$('abstractFilter').value||'all';$('abstractFilter').replaceChildren(option('all',t.all),option('yes',t.yes),option('no',t.no));$('abstractFilter').value=af;const kind=$('kind').value||'all';$('kind').replaceChildren(option('all',t.allKinds),...[...new Set(collection.papers.map(p=>p.kind).filter(Boolean))].map(x=>option(x,labelKind(x))));$('kind').value=kind;$('foot').replaceChildren();let a=el('a','',t.source);a.href=collection.source_url;a.target='_blank';a.rel='noopener noreferrer';$('foot').append(a);renderTopics()}
function renderTopics(){let t=tr(),items=[['all',t.allPapers,collection.papers.length],...[...collection.counts].map(([name,n])=>[name,labelTopic(name),n])];$('topics').replaceChildren(...items.map(([id,name,count])=>{let b=el('button','topic');b.type='button';b.setAttribute('aria-current',String(topic===id));b.append(el('span','',name),el('span','',fmt(count)));b.onclick=()=>{topic=id;renderTopics();search();$('sidebar').classList.remove('open');$('toggle').setAttribute('aria-expanded','false')};return b}))}
function search(){if(!collection)return;let terms=norm($('query').value).trim().split(/\s+/).filter(Boolean),af=$('abstractFilter').value,kind=$('kind').value;found=collection.papers.filter((p,i)=>(topic==='all'||p.topics.includes(topic))&&(kind==='all'||p.kind===kind)&&(af==='all'||(af==='yes')===!!abstract(p))&&terms.every(x=>collection.search[i].includes(x)));page=1;render()}
function addLink(parent,l){try{let u=new URL(l.url);if(!['https:','http:'].includes(u.protocol))return;let name=lang()==='en'?(linksEn[l.label]||'Source'):l.label;let a=el('a','',name+' ↗');a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';parent.append(a)}catch(e){}}
function openReader(p,trigger){const t=tr();lastTrigger=trigger;$('readerLabel').textContent=collection.conference+' '+collection.year+' · '+t.reader;let body=$('reader');body.replaceChildren();let h=el('h2','',displayTitle(p));h.id='readerTitle';body.append(h);let meta=[p.authors,labelKind(p.kind)];if(lang()==='zh'&&p.track)meta.push(p.track);body.append(el('p','meta',meta.filter(Boolean).join(' · ')));let ts=el('div','tags');for(let x of p.topics)ts.append(el('span','tag',labelTopic(x)));body.append(ts);let section=el('section');section.append(el('h3','',t.abstract),el('p','',abstract(p)||t.missingDetail));body.append(section);let sec=el('section');sec.append(el('h3','',t.paperLinks));let ls=el('div','linklist');for(const l of p.links)addLink(ls,l);if(!ls.children.length)ls.append(el('span','',t.noLinks));sec.append(ls);if(p.abstract_source){let source=lang()==='en'?(sourcesEn[p.abstract_source]||(/[\u3400-\u9fff]/.test(p.abstract_source)?'Academic source':p.abstract_source)):p.abstract_source;sec.append(el('p','meta',t.abstractSource+source))}body.append(sec);dialog.showModal()}
function render(){const t=tr();let total=Math.max(1,Math.ceil(found.length/size));page=Math.min(page,total);$('resultsTitle').textContent=topic==='all'?t.allPapers:labelTopic(topic);$('count').textContent=t.found(found.length);$('papers').replaceChildren();for(let [i,p] of found.slice((page-1)*size,page*size).entries()){let card=el('article','card'),top=el('div','card-top'),has=!!abstract(p);top.append(el('span','',String((page-1)*size+i+1).padStart(3,'0')));if(!has)top.append(el('span','badge missing',t.missing));let title=el('button','title',displayTitle(p));title.type='button';title.onclick=()=>openReader(p,title);let excerpt=el('p','excerpt',abstract(p)||t.missingDetail);let bottom=el('div','bottom'),tags=el('div','tags');for(const x of p.topics.slice(0,3))tags.append(el('span','tag',labelTopic(x)));let read=el('button','read',t.read);read.onclick=()=>openReader(p,read);bottom.append(tags,read);card.append(top,title,excerpt,bottom);$('papers').append(card)}if(!found.length)$('papers').append(el('div','empty',t.empty));$('page').textContent=page+' / '+total;$('prev').disabled=page<=1;$('next').disabled=page>=total}
let conferences=[...new Set(data.collections.map(c=>c.conference))];selectOptions($('conference'),conferences,conferences[0]);function updateYears(){let years=[...new Set(data.collections.filter(c=>c.conference===$('conference').value).map(c=>String(c.year)))].sort((a,b)=>b-a);selectOptions($('year'),years,years[0]);setCollection()}$('conference').onchange=updateYears;$('year').onchange=setCollection;$('language').onchange=()=>{if(collection){localize();search()}};let timer;$('query').oninput=()=>{clearTimeout(timer);timer=setTimeout(search,100)};$('abstractFilter').onchange=search;$('kind').onchange=search;$('reset').onclick=()=>{if(!collection)return;$('query').value='';$('abstractFilter').value='all';$('kind').value='all';topic='all';renderTopics();search()};$('prev').onclick=()=>{if(page>1){page--;render()}};$('next').onclick=()=>{if(page<Math.ceil(found.length/size)){page++;render()}};$('close').onclick=()=>dialog.close();dialog.addEventListener('close',()=>{if(lastTrigger)lastTrigger.focus()});$('toggle').onclick=()=>{let open=$('sidebar').classList.toggle('open');$('toggle').setAttribute('aria-expanded',String(open))};updateYears()})();
</script></body></html>
